
events {
    worker_connections  1024;    # 每个 worker 进程的最大连接数
    use epoll;                    # Linux 下使用 epoll 事件模型
    multi_accept on;              # 尽可能多地接受新连接
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 恶意 UA 拦截（使用 map 避免 if 陷阱）
    map $http_user_agent $blocked_ua {
        default               0;
        ~*(sqlmap|nikto|nmap|python|curl|scanner) 1;
    }

    # 限制请求方法
    map $request_method $blocked_method {
        default               0;
        ~^(GET|POST|HEAD|OPTIONS)$ 0;
    }


    server {
        listen       80;
        server_name  jtgy.gemstonecn.com;
        return 301 https://jtgy.gemstonecn.com$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  jtgy.gemstonecn.com;

        client_max_body_size 100m;

        # SSL 配置（修复路径）
        ssl_certificate      /usr/local/nginx/cert/jtgy.gemstonecn.com.pem;
        ssl_certificate_key  /usr/local/nginx/cert/jtgy.gemstonecn.com.key;
        ssl_session_timeout  5m;
        ssl_ciphers          ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # 安全响应头
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 拦截恶意 UA
        if ($blocked_ua) {
            return 403;
        }

        # 限制请求方法
        if ($blocked_method) {
            return 405;
        }

        # 禁止隐藏文件
        location ~ /\. {
            deny all;
            return 403;
        }

        location / {
            root   /data/projects/answer/nginx_file;
            index  index.html;
            try_files $uri $uri/ @router;
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }

        location /nginx/ {
            proxy_pass http://127.0.0.1:2400/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:2400/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60000;
        }

        location /aiws/ {
            proxy_pass https://eai.bwenai.com:12837/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60000;
            # 如果目标证书有问题，可以添加：
            # proxy_ssl_verify off;
        }

        # QQ 官方机器人 Webhook（my-bot，本地 3100 端口）
        # 开放平台回调地址：https://jtgy.gemstonecn.com/qqbot/webhook
        location = /qqbot/webhook {
            proxy_pass http://127.0.0.1:3100/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}