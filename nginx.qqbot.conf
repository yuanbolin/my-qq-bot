# QQ 机器人 Webhook 反代片段
# 用法：在 server { listen 443 ssl; ... } 内 include 本文件，或复制 location 块
#
# 前提：
#   - 机器人 BOT_MODE=webhook，WEBHOOK_PORT=3100，WEBHOOK_PATH=/webhook
#   - QQ 开放平台回调地址：https://jtgy.gemstonecn.com/qqbot/webhook
#
# 注意：若主配置拦截了含 python/curl 的 User-Agent，QQ 回调可能被 403，
#       建议为本 location 单独放行（见下方注释示例）

location = /qqbot/webhook {
    proxy_pass http://127.0.0.1:3100/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # 仅允许 POST（QQ 事件推送）
    limit_except POST {
        deny all;
    }
}
